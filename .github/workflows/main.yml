
name: Docker CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  build-test-push:
    if: github.event_name == 'push' || github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t esha-app:latest -f DP/Dockerfile DP/

      - name: Test Docker Container
        run: |
          docker run --rm esha-app:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker tag esha-app:latest ${{ secrets.DOCKERHUB_USERNAME }}/esha-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/esha-app:latest

 
  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/esha-app:latest
            docker stop esha-app || true
            docker rm esha-app || true
            docker run -d --restart unless-stopped --name esha-app -p 80:5000 ${{ secrets.DOCKERHUB_USERNAME }}/esha-app:latest

