
name: AI Smart Solutions CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ai-smart-solutions:test .

      - name: Run Container
        run: |
          docker run -d -p 8080:80 --name ai-smart-solutions ai-smart-solutions:test

      - name: Test Application
        run: |
          sleep 5
          curl --fail http://localhost:8080

      - name: Stop Container
        if: always()
        run: |
          docker stop ai-smart-solutions || true
          docker rm ai-smart-solutions || true

  push-to-dockerhub:
    name: Push Image to Docker Hub
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-smart-solutions:latest

  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: push-to-dockerhub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ai-smart-solutions:latest
            docker stop ai-smart-solutions || true
            docker rm ai-smart-solutions || true
            docker run -d --restart unless-stopped --name ai-smart-solutions -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/ai-smart-solutions:latest
            docker ps
